<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Quotes Site</title>
</head>
<body style="font-family: sans-serif; max-width: 900px; margin: 20px auto; padding: 0 15px;">
    <nav style="display: flex; gap: 15px; align-items: center; border-bottom: 1px solid #ccc; padding-bottom: 15px;">
        <a href="{% url 'home' %}"><strong>Головна</strong></a>
        {% if user.is_authenticated %}
            <span>Привіт, <strong>{{ user.username }}</strong>!</span>
            <a href="{% url 'add_author' %}">Додати автора</a>
            <a href="{% url 'add_quote' %}">Додати цитату</a>
            <form action="{% url 'logout' %}" method="post" style="display:inline;">
                {% csrf_token %}
                <button type="submit">Вийти</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}">Увійти</a>
            <a href="{% url 'register' %}">Реєстрація</a>
        {% endif %}
    </nav>
    <main style="margin-top: 20px;">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
