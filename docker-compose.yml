services:
  db:
    image: postgres:latest
    container_name: postgres-hw10
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
  # web:
  #   build: .
  #   container_name: django-hw10
  #   ports:
  #     - "8000:8000"

volumes:
  pgdata: